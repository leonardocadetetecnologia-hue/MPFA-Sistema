name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mpfa
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mpfa_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mpfa -d mpfa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable CI services only. Never point CI at staging/production.
      APP_ENV: local
      LOG_LEVEL: error
      DATABASE_URL: postgresql://mpfa:ci-only-password@localhost:5432/mpfa_ci
      REDIS_URL: redis://localhost:6379
      API_INTERNAL_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build:packages
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrations on a clean database
        run: npm run db:migrate:deploy
      - run: npm run test:integration
      - run: npm run build

      - name: Backup and restore round-trip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          export PG_BIN_DIR=/usr/lib/postgresql/17/bin
          BACKUP_DIR=./backups bash infrastructure/scripts/backup.sh
          $PG_BIN_DIR/psql "$DATABASE_URL" -c 'CREATE DATABASE mpfa_restore_check'
          RESTORE_DATABASE_URL=postgresql://mpfa:ci-only-password@localhost:5432/mpfa_restore_check \
            bash infrastructure/scripts/restore.sh "$(ls backups/*.dump | head -n1)"

  docker:
    name: docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: cp .env.example .env && docker compose config --quiet
      - name: Build images
        run: |
          for target in api worker web migrate; do
            docker build -f infrastructure/docker/Dockerfile --target "$target" -t "mpfa-$target:ci" .
          done
